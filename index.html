/* ================= BRANDEE'S | SWEET BOUTIQUE THEME 2026 ================= */
:root{--ink:#522b38;--olive:#c83760;--paper:#fffaf6;--line:#efcec9;--muted:#8e6d70;--berry:#b82b59;--rose:#f36d7d;--caramel:#ce7a3c;--cream:#fff9ed}
html{scroll-padding-top:28px}
body{background:radial-gradient(ellipse 70% 28% at 8% 6%,#fff0da 0,transparent 100%),radial-gradient(ellipse 58% 34% at 92% 23%,#ffe6ed 0,transparent 100%),linear-gradient(180deg,#fffaf6 0%,#fff7ef 43%,#fff9f5 100%);color:var(--ink)}
.announcement{height:43px;background:linear-gradient(95deg,#b82c5d 0%,#e65b75 53%,#f5a258 100%);color:#fff;box-shadow:0 4px 18px #bd405322;font-weight:700;font-size:11px;letter-spacing:.35px;padding:0 24px}
.announcement span{color:#fff9e8;letter-spacing:1.2px;font-size:9px;font-weight:600}
header{border-color:#f2cfc8;background:#fffaf6c9;border-radius:0 0 22px 22px;padding:0 22px;box-shadow:0 8px 24px #df837016;margin-top:0}
header .brand{color:#b02b53;text-shadow:0 1px 0 #ffe5e3,0 2px 0 #ffb3bb,0 3px 0 #e2758b,0 4px 0 #ab3b60,2px 8px 10px #a43c5240}
header .brand span{color:#8f5965}
header .brand::after{color:#f4a636}
nav{font-weight:700;color:#7b4b53}
nav a:hover{color:#bc3159;border-color:#bc3159}
.bag{border:1px solid #eaa3b1;background:linear-gradient(135deg,#ffedf0,#fff7ee);color:#aa2f54;box-shadow:0 7px 22px #c53c581f}
.bag b{background:#ba2b5d}
.hero{min-height:590px;align-items:stretch;padding-top:45px}
.hero-copy{padding-top:44px}
.eyebrow{color:#b53c62;font-weight:700;letter-spacing:1.75px}
.eyebrow>span{background:#dd8b77}
h1{color:#5e263d;letter-spacing:-2px}
h1 em{color:#cd4963}
.hero-copy>p{max-width:560px;color:#805d64;font-size:14px;line-height:2}
.primary,.add-cart{background:linear-gradient(135deg,#cb3863,#ed6a75);color:#fff;border-radius:11px;box-shadow:0 7px 18px #bc355328;font-weight:700;transition:transform .2s,box-shadow .2s,filter .2s}
.primary:hover,.add-cart:hover{background:linear-gradient(135deg,#b92e58,#e95a70);transform:translateY(-2px);box-shadow:0 10px 23px #b82b5940}
.hero-image{border-radius:220px 220px 25px 25px;background:#f6d0b6;box-shadow:0 22px 42px #ba65542e}
.hero-image>img{filter:brightness(.93) saturate(1.11)}
.round-stamp{background:linear-gradient(145deg,#cc3f68ed,#af2f57f2);border:2px solid #fff6e4;color:#fff9ec;box-shadow:0 7px 28px #66233a66}
.image-caption{filter:drop-shadow(0 2px 5px #2b1b1b70)}
.hero-bottom{color:#966b6b}
.values{background:linear-gradient(105deg,#fff0d8,#ffe0e7 52%,#fff1e0);border-top:1px solid #f2cfc5;border-bottom:1px solid #f2cfc5;gap:40px;flex-wrap:wrap;box-shadow:inset 0 2px 0 #ffffffaa}
.values span{font-weight:700;color:#9b3d55}
.values svg{color:#d15870}
.values i{color:#e59c4f}
.collection{position:relative}
.collection:before{content:'✦';position:absolute;right:5%;top:20px;color:#f1af96;font-size:38px;opacity:.47;pointer-events:none}
.section-heading h2{color:#632f42}
.section-heading p{color:#95646d}
.filters button{background:#fffdfa;border-color:#f0c9c9;color:#965368;font-weight:600;transition:.18s}
.filters button:hover{background:#ffe7ed;border-color:#e5a4af}
.filters button.active{background:linear-gradient(125deg,#bb2e59,#e76c75);border-color:transparent;color:white;box-shadow:0 5px 14px #c83d572e}
.product{background:linear-gradient(170deg,var(--tint),#fffefa 78%);box-shadow:0 9px 26px #b76c6330;border-radius:19px;border-top-width:5px}
.product[data-kind="Cookies"]{--frame:#d6a05a;--tint:#fff1d8;--shade:#ca834c20}
.product[data-kind="Crackers"]{--frame:#e8a16e;--tint:#fff0e6;--shade:#d49a6620}
.product[data-kind="Bánh kem"]{--frame:#e38b9f;--tint:#ffebf2;--shade:#d9789924}
.product[data-kind="Bánh su kem"]{--frame:#c3a0cc;--tint:#f7eafa;--shade:#9672a522}
.product-photo{background:linear-gradient(145deg,#fffaf4,#fff0e9)!important;border:1px solid #ffebe2}
.product h3{color:#603345;font-weight:600}
.product-meta{color:#a06b72}
.product-price strong{font-size:15px;color:#a52c4f}
.tag{background:#fff2f2;color:#aa3156;border-radius:8px;font-weight:700}
.quick-add{background:#fff0ea;color:#b83f5d}
.in-cart{color:#956d70}
.product-buy .stepper{border-color:#e6b7b8;background:#fffcfb}
.product-buy .stepper button:hover{background:#ffe8ed}
.story{background:linear-gradient(135deg,#ffe6dd 0%,#fff1e0 55%,#ffe4ed 100%);border-radius:25px;overflow:hidden;box-shadow:0 14px 30px #cc7f7424}
.story-image img{filter:saturate(1.07) brightness(.96)}
.story-copy{padding-top:48px;padding-bottom:45px}
.story h2{color:#742f48}
.story h2 em{color:#ca536a}
.story p{color:#7d5b63;font-size:13px;line-height:1.95}
.text-link{border-color:#bb3f5e;color:#a52a51;font-weight:700}
.closing{margin:0 5% 70px;padding:56px 24px 58px;border-radius:25px;background:radial-gradient(circle at 10% 20%,#fff3b7b8,transparent 35%),linear-gradient(115deg,#ffe4e8,#fff1db 60%,#ffe1d6);box-shadow:0 12px 32px #d47f7e25}
.closing>span{color:#ab5070;font-weight:700}
.closing h2{color:#8e3550;font-size:clamp(25px,3.1vw,43px)}
footer{background:linear-gradient(125deg,#66243f 0%,#9e3156 55%,#c25a62 100%);color:#fff9f6;border-radius:32px 32px 0 0;gap:30px 44px;padding:52px 5% 24px}
footer .brand{color:#fff6e9;text-shadow:0 3px 8px #42152a60}
footer .brand span{color:#ffccd3}
footer p,footer a:not(.brand){color:#ffe0e3;font-size:12px}
footer h4{color:#ffe7bf;font-size:11px;font-weight:700}
footer a[href^="mailto:"]:hover,footer a[href^="tel:"]:hover{color:#fff}
.contact-hotline{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 30px;background:linear-gradient(100deg,#fffaf3,#ffe1dd);color:#92344f;border-radius:18px;padding:21px 28px;box-shadow:0 10px 30px #4a132b3d;border:2px solid #ffd0c4}
.hotline-lead{font-size:12px;font-weight:800;letter-spacing:1px;color:#8f3651}
footer .contact-hotline .hotline-number{margin:0;color:#ad2852!important;font-size:clamp(27px,3vw,39px)!important;font-weight:800;letter-spacing:.8px;line-height:1.2;white-space:nowrap;text-shadow:0 2px 0 #fff6e9}
footer .contact-hotline .hotline-number:hover{color:#ea4459!important}
.hotline-note{font-size:11px;color:#945d64}
.footer-bottom{color:#ffe1e3;border-color:#ffffff36}
.footer-bottom button{border-color:#ffc1cd;background:#ffffff16}
.footer-bottom button:hover{background:#ffffff27}
.drawer{background:#fffaf6}
input,select,textarea{background:#fffdfb;border-color:#e8c9c7}
input:focus,select:focus,textarea:focus{border-color:#c43f63;box-shadow:0 0 0 3px #f1a6b94d}
.cloud-status{background:#fff0e6;color:#8a4b4f}
.order-submit,.order-submit:hover{background:linear-gradient(145deg,#dc375e,#ad234e);box-shadow:0 5px 0 #851b3b,0 10px 22px #ae222c28}
@media(max-width:1100px){.announcement span{display:none}.hero-copy{padding-top:20px}.contact-hotline{justify-content:center;text-align:center}}
@media(max-width:700px){.announcement{height:auto;min-height:37px;padding:7px 12px;font-size:9px;text-align:center;line-height:1.6}.announcement span{display:none}header{margin:0 4%;padding:0 9px;border-radius:0 0 14px 14px;height:96px}header .brand{font-size:35px}h1{font-size:clamp(42px,10.7vw,54px)}.hero{padding-top:8px;gap:24px}.hero-copy{padding:28px 0 0}.hero-copy>p{font-size:12px;line-height:1.9}.hero-image{min-height:390px;border-radius:160px 160px 18px 18px}.values{gap:8px;flex-wrap:nowrap;padding:19px 3%}.values span{font-size:9px;line-height:1.55;flex:1;gap:6px}.values svg{width:23px;height:23px}.values i{font-size:11px}.collection{padding-top:54px}.product{padding:9px}.product h3{font-size:17px}.story{border-radius:17px}.story-copy{padding:32px 23px}.closing{margin:0 4% 46px;padding:38px 14px;border-radius:18px}.closing h2{font-size:28px}footer{padding:40px 5% 24px;border-radius:24px 24px 0 0}.contact-hotline{padding:22px 14px;gap:9px;border-radius:15px}.hotline-lead{font-size:11px}footer .contact-hotline .hotline-number{font-size:clamp(26px,8vw,34px)!important}.hotline-note{font-size:10px;line-height:1.6}.footer-bottom{flex-wrap:wrap}.footer-bottom button{margin-left:auto}}
@media(max-width:370px){header .brand{font-size:30px}.values span{font-size:8px}.values i{display:none}.hero-image{min-height:330px}}
@media(prefers-reduced-motion:reduce){.primary,.add-cart{transition:none}}

/* BRANDEE'S admin — quick access QR photo merging */
.admin-qr-tool-link{display:flex;align-items:center;gap:14px;width:100%;margin:0 0 20px;padding:16px 18px;text-decoration:none;background:linear-gradient(115deg,#fff0f3 0%,#fff3df 100%);border:1.5px solid #edb3c4;border-radius:16px;color:#8c244b;box-shadow:0 6px 20px #b72c5712;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.admin-qr-tool-link:hover,.admin-qr-tool-link:focus-visible{transform:translateY(-2px);box-shadow:0 11px 24px #b72c5722;border-color:#c83760;outline:none}
.admin-qr-tool-icon{display:grid;place-items:center;width:48px;height:48px;flex:0 0 48px;border-radius:14px;background:#c83760;color:white;font-size:32px;line-height:1;font-weight:800}
.admin-qr-tool-description{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.admin-qr-tool-description strong{font-size:15px;font-weight:700;line-height:1.3}
.admin-qr-tool-description small{font-size:11px;color:#9b6870;line-height:1.4;overflow-wrap:anywhere}
.admin-qr-tool-arrow{font-size:22px;font-weight:700;color:#b62d5a;padding-left:4px}
@media(max-width:700px){.admin-qr-tool-link{padding:13px;gap:11px;border-radius:12px}.admin-qr-tool-icon{width:42px;height:42px;flex-basis:42px;font-size:27px}.admin-qr-tool-description strong{font-size:13px}.admin-qr-tool-description small{font-size:10px}}
